# Disparo diario dos e-mails ao cliente (pontos a vencer, categoria Lorenzi+ e reenvio dos resumos
# de compra que falharam). Chama a API em producao, que decide quem recebe e manda cada e-mail ao
# webhook do n8n (app/automacoes/emails.py).
#
# Precisa do segredo do repositorio CHAVE_AUTOMACAO (Settings -> Secrets and variables -> Actions),
# com o mesmo valor da variavel CHAVE_AUTOMACAO do Render. Da para rodar na mao em Actions ->
# "Avisos diarios por e-mail" -> Run workflow (com a opcao de so simular).
name: Avisos diarios por e-mail

on:
  schedule:
    # 12:00 UTC = 9h em Sao Paulo.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "So listar quem receberia, sem enviar"
        type: boolean
        default: false

permissions: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar os avisos
        env:
          CHAVE: ${{ secrets.CHAVE_AUTOMACAO }}
          API: https://backend-casalorenzi.onrender.com
          SIMULAR: ${{ github.event.inputs.simular || 'false' }}
        run: |
          if [ -z "$CHAVE" ]; then echo "Falta o segredo CHAVE_AUTOMACAO"; exit 1; fi
          # O plano gratis do Render dorme: a primeira chamada acorda o servidor.
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 "$API/health" > /dev/null
          curl -fsS --max-time 600 -X POST \
            -H "X-Chave-Automacao: $CHAVE" \
            "$API/api/v1/automacoes/disparar-emails?simular=$SIMULAR"
